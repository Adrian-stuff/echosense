<svg xmlns="http://www.w3.org/2000/svg" width="1380" height="536" viewBox="0 0 1380 536" role="img" aria-labelledby="title desc">
<title id="title">Context-level data-flow diagram of EchoSense</title><desc id="desc">Process 0 exchanges data with a child user, a parent or caregiver, and a Kinect or test depth source. Spoken cues go to the child. A caregiver enters the child’s practice responses.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 4 L0 8 Z" fill="#20242a"/></marker></defs>
<rect width="1380" height="536" fill="white"/>
<text x="48" y="49" text-anchor="start" font-family="Georgia,serif" font-size="24" font-weight="700" font-style="normal" fill="#20242a">Figure 1</text>
<text x="48" y="88" text-anchor="start" font-family="Georgia,serif" font-size="30" font-weight="400" font-style="italic" fill="#20242a">Context-level diagram of EchoSense</text>
<rect x="48" y="237" width="214" height="108" rx="0" fill="white" stroke="#454b53" stroke-width="1.6"/>
<text x="155.0" y="297.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" font-style="normal" fill="#20242a">Child user</text>
<rect x="518" y="196" width="340" height="188" rx="11" fill="white" stroke="#454b53" stroke-width="1.6"/>
<path d="M518 224 V207 Q518 196 529 196 H847 Q858 196 858 207 V224 Z" fill="#e8ebee"/>
<path d="M518 224 H858" fill="none" stroke="#454b53" stroke-width="1.6"/>
<text x="688.0" y="216" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700" font-style="normal" fill="#20242a">0</text>
<text x="688.0" y="290.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" font-style="normal" fill="#20242a">EchoSense</text>
<text x="688.0" y="310.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" font-style="normal" fill="#20242a">Assistive device and</text>
<text x="688.0" y="330.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" font-style="normal" fill="#20242a">parent dashboard</text>
<rect x="1120" y="207" width="212" height="166" rx="0" fill="white" stroke="#454b53" stroke-width="1.6"/>
<text x="1226.0" y="286.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" font-style="normal" fill="#20242a">Parent or</text>
<text x="1226.0" y="306.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" font-style="normal" fill="#20242a">caregiver</text>
<rect x="544" y="435" width="288" height="58" rx="0" fill="white" stroke="#454b53" stroke-width="1.6"/>
<text x="688.0" y="470.0" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" font-style="normal" fill="#20242a">Kinect or test depth source</text>
<path d="M262 264 H518" fill="none" stroke="#20242a" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="390" y="253" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" font-style="normal" fill="#20242a">Physical control inputs</text>
<path d="M518 319 H262" fill="none" stroke="#20242a" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="390" y="292" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400" font-style="normal" fill="#20242a">Obstacle cues, practice cues</text>
<text x="390" y="309" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400" font-style="normal" fill="#20242a">and spoken alerts</text>
<path d="M1120 231 H858" fill="none" stroke="#20242a" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="989" y="207" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#20242a">Credentials, account actions</text>
<text x="989" y="223" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#20242a">and fitting settings</text>
<path d="M1120 276 H858" fill="none" stroke="#20242a" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="989" y="252" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#20242a">Practice controls and answers,</text>
<text x="989" y="268" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#20242a">clip commands and backup files</text>
<path d="M858 321 H1120" fill="none" stroke="#20242a" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="989" y="297" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#20242a">Access status, fitting preview,</text>
<text x="989" y="313" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#20242a">live view and device status</text>
<path d="M858 366 H1120" fill="none" stroke="#20242a" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="989" y="342" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#20242a">Practice results, footage,</text>
<text x="989" y="358" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" font-style="normal" fill="#20242a">reports and ZIP backups</text>
<path d="M688 435 V384" fill="none" stroke="#20242a" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="705" y="414" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400" font-style="normal" fill="#20242a">Depth frames and supported color</text>
<text x="48" y="518" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400" font-style="normal" fill="#4b545e">The caregiver records the child’s pointing responses during supervised practice.</text>
</svg>
