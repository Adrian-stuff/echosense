<svg xmlns="http://www.w3.org/2000/svg" width="1520" height="545" viewBox="0 0 1520 545" role="img" aria-labelledby="title desc">
<title id="title">Table 1. Comparison of EchoSense and related assistive tools</title>
<desc id="desc">✓ = documented or implemented. ✗ = unavailable in the EchoSense prototype or unverified in the cited materials for the other tools. EchoSense prototype: Detect nearby obstacles, Play spatial obstacle alerts, Log supervised practice results, Record caregiver review clips, Export practice reports, Restore records from a backup. NOA by biped.ai [1]: Detect nearby obstacles, Play spatial obstacle alerts, Give turn-by-turn route directions, Read printed text aloud. WeWALK Smart Cane 2 [2]: Detect nearby obstacles, Give turn-by-turn route directions. Microsoft Seeing AI [3]: Read printed text aloud. Lazarillo [4]: Give turn-by-turn route directions.</desc>
