<text x="48" y="1038" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400" font-style="normal" fill="#4b545e">Rectangles denote external entities. Numbered boxes denote processes. Open-ended boxes denote data stores.</text>
<text x="48" y="1064" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400" font-style="normal" fill="#4b545e">D1 and D3 share the device’s SQLite database. D4 represents browser storage. Access checks apply to protected browser operations.</text>
<text x="48" y="1090" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400" font-style="normal" fill="#4b545e">The caregiver captures child responses and uses the browser to download or restore backup files.</text>
