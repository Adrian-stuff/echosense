<svg xmlns="http://www.w3.org/2000/svg" width="1380" height="1106" viewBox="0 0 1380 1106" role="img" aria-labelledby="title desc">
<title id="title">Level 1 data-flow diagram of EchoSense</title><desc id="desc">Five processes handle access, fitting, sensing and audio, supervised practice, and footage and reporting. Four stores represent account records, settings, practice records, and browser data.</desc>
